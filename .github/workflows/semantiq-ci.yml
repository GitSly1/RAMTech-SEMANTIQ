name: SEMANTIQ CI

on:
  pull_request:
    branches:
      - main
      - rvsc/SEM-003-rtudes-baseline-import
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile imported baseline modules
        run: python -m compileall -q geo_reference.py interpretation_layer.py src tests

      - name: Run SEMANTIQ tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
